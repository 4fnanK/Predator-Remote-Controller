name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build, lint and test (scripts/build.ps1)
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Upload single-file build
        uses: actions/upload-artifact@v4
        with:
          name: PredatorRemoteController-${{ github.sha }}
          path: |
            dist/PredatorRemoteController.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
