# Link the MSVC C runtime statically so predator-service.exe / predator-tray.exe do not depend on
# VCRUNTIME140.dll (the Visual C++ Redistributable is not part of a clean Windows install).
# The Universal CRT (api-ms-win-crt-*) ships with Windows 10/11.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
